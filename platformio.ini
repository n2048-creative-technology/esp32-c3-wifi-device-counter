; Wi-Fi + BLE device counter for the Seeed XIAO ESP32-C3 and XIAO ESP32-C5,
; driving the 1.8" 128x160 SPI TFT (ST7735) from the
; esp32-c3-tft-sdcard-looper- project. Wiring: see README.md (same XIAO
; D-pin labels on both boards).
;
; Both boards use the pioarduino platform (Arduino-ESP32 3.x): the official
; platformio/espressif32 platform doesn't support the C5. Pinned to an exact
; release so builds are reproducible.
;
;   pio run -e xiao_esp32c3 -t upload
;   pio run -e xiao_esp32c5 -t upload

[platformio]
default_envs = xiao_esp32c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Wi-Fi + Bluedroid BLE exceeds the default 1.25MB app slot; both boards have >= 4MB flash.
board_build.partitions = huge_app.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11

; 2.4 GHz only (channels 1-13/14).
[env:xiao_esp32c3]
board = seeed_xiao_esp32c3

; Dual-band: 2.4 GHz + 5 GHz.
[env:xiao_esp32c5]
board = seeed_xiao_esp32c5
