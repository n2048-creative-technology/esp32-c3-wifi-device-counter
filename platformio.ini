; XIAO ESP32-C3 driving the 1.8" 128x160 SPI TFT (ST7735) from the
; esp32-c3-tft-sdcard-looper- project, repurposed as a Wi-Fi device-count
; display + relay controller. No SD card needed for this project.
; Wiring: see README.md

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
